<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>دلتا — تعلّم Luau وبرمجة روبلوكس بالعربي</title>
<style>
:root{
  --bg:#0b1220;--card:#111c33;--card2:#16233d;--text:#e8eefc;--muted:#9fb0cc;
  --line:#1f2d4a;--acc:#4cc9f0;--acc2:#b388ff;--ok:#3ddc97;--warn:#ffb703;--bad:#ff6b6b;
  --r:14px;
}
[data-theme="light"]{
  --bg:#f5f7fb;--card:#fff;--card2:#f7f9fd;--text:#0e1626;--muted:#5b6b85;--line:#e2e8f2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.85;font-size:16px;
  padding-bottom:80px;
}
a{color:var(--acc);text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}

header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.h-in{display:flex;align-items:center;gap:10px;height:58px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.logo svg{width:30px;height:30px}
.logo small{display:block;font-weight:500;font-size:11px;color:var(--muted);line-height:1}
.spacer{flex:1}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);display:grid;place-items:center;cursor:pointer;
}
.icon-btn:active{transform:scale(.94)}

nav.tabs{
  display:flex;gap:6px;overflow-x:auto;padding:8px 14px 10px;scrollbar-width:none;
  max-width:1000px;margin:0 auto;
}
nav.tabs::-webkit-scrollbar{display:none}
.tab-btn{
  flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;font-size:13px;white-space:nowrap;
  color:var(--muted);font-weight:700;
}
.tab-btn.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#071019;border-color:transparent}

.section{display:none;animation:fade .25s ease}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h1{font-size:clamp(24px,6vw,34px);line-height:1.35;margin:20px 0 8px}
h2{font-size:clamp(19px,4.5vw,24px);margin:24px 0 10px}
h3{font-size:17px;margin:16px 0 6px}
p{margin:0 0 12px;color:var(--muted)}
.lead{color:var(--muted);font-size:16px}

.hero{
  background:radial-gradient(1200px 400px at 80% -10%,rgba(76,201,240,.15),transparent),
             radial-gradient(900px 400px at 10% 10%,rgba(179,136,255,.13),transparent);
  border:1px solid var(--line);border-radius:22px;padding:26px 18px;margin:14px 0;
}
.hero .badge{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:5px 12px;border-radius:999px;background:rgba(76,201,240,.15);
  color:var(--acc);border:1px solid rgba(76,201,240,.3);margin-bottom:10px;
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--acc)}
.stat span{font-size:12px;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.grid{display:grid;gap:10px}
@media(min-width:680px){.grid.two{grid-template-columns:1fr 1fr}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);cursor:pointer;font-weight:700;
  font-size:14px;transition:.15s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#071019;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:8px}
.btn.danger{background:rgba(255,107,107,.1);color:var(--bad);border-color:rgba(255,107,107,.35)}
.btn:disabled{opacity:.5;cursor:not-allowed}

label.field{display:block;margin-bottom:12px;font-size:13px;color:var(--muted);font-weight:700}
input[type=text]{
  display:block;width:100%;margin-top:6px;padding:11px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--card2);color:var(--text);
}
input[type=text]:focus{outline:2px solid var(--acc);outline-offset:1px}

.lesson{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
.lesson-h{
  width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;
  background:none;border:none;cursor:pointer;text-align:right;font-weight:700;color:var(--text);
}
.lesson-h .num{
  flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--acc);
}
.lesson.done .num{background:rgba(61,220,151,.15);color:var(--ok);border-color:rgba(61,220,151,.35)}
.lesson-h .t{flex:1;font-size:15px}
.lesson-h .chev{color:var(--muted);transition:.25s;font-size:18px}
.lesson.open .chev{transform:rotate(-90deg)}
.lesson-b{display:none;padding:0 16px 16px;border-top:1px solid var(--line);padding-top:12px}
.lesson.open .lesson-b{display:block}
.lesson-b ul{padding-right:18px;color:var(--muted);font-size:14px}
.lesson-b li{margin-bottom:4px}

.code-wrap{position:relative;margin:10px 0}
.code-head{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card2);border:1px solid var(--line);border-bottom:none;
  padding:6px 10px;border-radius:10px 10px 0 0;font-size:11px;color:var(--muted);
}
pre{
  margin:0;background:#06101e;border:1px solid var(--line);border-radius:0 0 10px 10px;
  padding:12px;overflow-x:auto;font-family:'Courier New',monospace;font-size:12.5px;
  line-height:1.6;direction:ltr;text-align:left;color:#cdd6f4;max-height:460px;
}
[data-theme="light"] pre{background:#0e1626;color:#e8eefc}
.hl-keyword{color:#ff79c6;font-weight:700}
.hl-string{color:#50fa7b}
.hl-comment{color:#6272a4;font-style:italic}
.hl-number{color:#f1fa8c}

.checker-box{margin-top:10px}
.checker-box textarea, .share-code{
  width:100%;min-height:220px;padding:12px;border-radius:10px;
  border:1px solid var(--line);background:#06101e;color:#cdd6f4;
  font-family:'Courier New',monospace;font-size:13px;line-height:1.55;
  direction:ltr;text-align:left;resize:vertical;
}
.checker-box textarea:focus, .share-code:focus{outline:2px solid var(--acc);outline-offset:1px}

.samples{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.samples .btn{font-size:12px;padding:6px 10px}

.result-card{
  border-radius:12px;padding:12px 14px;margin-top:12px;
  border:1px solid var(--line);background:var(--card);
}
.result-card.ok{border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.06)}
.result-card.warn{border-color:rgba(255,183,3,.4);background:rgba(255,183,3,.06)}
.result-card.err{border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.06)}
.result-card h4{margin:0 0 8px;font-size:15px}
.result-card ul{margin:0;padding-right:18px;font-size:13.5px}
.result-card li{margin-bottom:5px;color:var(--text);line-height:1.7}
.result-card li b{color:var(--acc)}

.link-out{
  width:100%;min-height:90px;padding:10px;border-radius:8px;
  border:1px solid var(--line);background:#06101e;color:#cdd6f4;
  font-family:'Courier New',monospace;font-size:12px;
  direction:ltr;text-align:left;resize:vertical;
}

.recent-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:var(--card2);
  margin-bottom:8px;
}
.recent-item .info{flex:1;min-width:0}
.recent-item .info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-item .info small{color:var(--muted);font-size:11px}
.recent-item .actions{display:flex;gap:4px;flex-wrap:wrap}
.recent-item .actions .btn{padding:5px 8px;font-size:11px;border-radius:6px}

.viewer-banner{
  background:rgba(76,201,240,.08);border:1px solid rgba(76,201,240,.3);
  border-radius:12px;padding:12px 14px;margin:12px 0;font-size:13px;color:var(--text);
}
.viewer-banner b{color:var(--acc)}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 2px;background:none;border:none;cursor:pointer;color:var(--muted);
  font-size:10px;font-weight:700;
}
.bn-item svg{width:20px;height:20px}
.bn-item.active{color:var(--acc)}

footer{text-align:center;padding:20px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:24px}
</style>
</head>
<body>

<header>
  <div class="wrap h-in">
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M16 3 L29 27 H3 Z" stroke="url(#g1)" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M16 11 L23 24 H9 Z" fill="url(#g1)" opacity=".35"/>
        <defs><linearGradient id="g1" x1="0" y1="0" x2="32" y2="32">
          <stop stop-color="#4cc9f0"/><stop offset="1" stop-color="#b388ff"/>
        </linearGradient></defs>
      </svg>
      <div>دلتا<small>تعلّم Luau وRoblox بالعربي</small></div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع">🌙</button>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="home">الرئيسية</button>
    <button class="tab-btn" data-tab="lessons">الدروس</button>
    <button class="tab-btn" data-tab="checker">فاحص الأكواد</button>
    <button class="tab-btn" data-tab="share">مشاركة الكود</button>
    <button class="tab-btn" data-tab="about">عن دلتا</button>
  </nav>
</header>

<main class="wrap">

  <!-- الرئيسية -->
  <section
